<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulasi 3D Karhutla Lahan Gambut - Three.js</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #07090e; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: #fff; }

    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* 9:16 Mobile View Frame toggle */
    .portrait-frame {
      max-width: 450px !important;
      max-height: 800px !important;
      border-radius: 28px;
      box-shadow: 0 0 60px rgba(255, 85, 0, 0.35), 0 0 0 4px rgba(255, 255, 255, 0.15);
      overflow: hidden;
    }

    /* Top Controls Bar */
    .top-controls {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 50;
      background: rgba(18, 22, 34, 0.78);
      backdrop-filter: blur(14px);
      padding: 10px 18px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    .btn {
      background: #23293a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn:hover { background: #323b54; transform: translateY(-1px); }
    .btn:active { transform: translateY(1px); }

    .btn-water {
      background: linear-gradient(135deg, #00b4d8, #0077b6);
      border-color: #90e0ef;
      box-shadow: 0 4px 16px rgba(0, 180, 216, 0.4);
    }
    .btn-water:hover { background: linear-gradient(135deg, #48cae4, #0096c7); }

    .btn-replay {
      background: #e65100;
      border-color: #ff9800;
      box-shadow: 0 4px 14px rgba(230, 81, 0, 0.4);
    }

    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      padding: 0 4px;
    }
    .slider-wrap input {
      accent-color: #ff6d00;
      cursor: pointer;
      width: 80px;
    }

    /* Floating KPI Cards (Middle-Right / Top) */
    .kpi-container {
      position: absolute;
      top: 90px;
      right: 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 40;
      pointer-events: none;
      transition: all 0.4s ease;
    }

    .kpi-card {
      background: rgba(15, 20, 32, 0.85);
      backdrop-filter: blur(16px);
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 16px 22px;
      min-width: 260px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
      transform: translateX(350px);
      opacity: 0;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
    }
    .kpi-card.show {
      transform: translateX(0);
      opacity: 1;
    }

    .kpi-card.danger {
      border-color: #ff1744;
      background: rgba(40, 10, 14, 0.9);
      box-shadow: 0 0 35px rgba(255, 23, 68, 0.45);
    }

    .kpi-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .kpi-card.danger .kpi-label { color: #ff8a80; }

    .kpi-value {
      font-size: 38px;
      font-weight: 900;
      line-height: 1.1;
      color: #fff;
      font-family: 'Arial Black', sans-serif;
    }
    .kpi-card.danger .kpi-value { color: #ff1744; text-shadow: 0 0 20px rgba(255, 23, 68, 0.8); }

    .kpi-status {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-top: 4px;
      color: #ff5252;
      animation: pulseAlert 1.2s infinite;
    }

    @keyframes pulseAlert {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.98); }
    }

    /* Bottom Subtitle & Babak Overlay */
    .bottom-overlay {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 48px);
      max-width: 720px;
      background: rgba(10, 14, 24, 0.88);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 26px;
      padding: 20px 28px;
      z-index: 50;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.7);
      text-align: center;
    }

    .babak-pill {
      display: inline-block;
      background: #ff6d00;
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 5px 16px;
      border-radius: 20px;
      margin-bottom: 8px;
      box-shadow: 0 4px 14px rgba(255, 109, 0, 0.5);
    }

    .babak-title {
      font-size: 26px;
      font-weight: 900;
      color: #fff;
      margin-bottom: 6px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    .babak-desc {
      font-size: 15px;
      line-height: 1.45;
      color: #cbd5e1;
      font-weight: 500;
    }

    /* Timeline Progress Bar */
    .timeline-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 5px;
      background: linear-gradient(90deg, #ff9100, #ff1744);
      width: 0%;
      z-index: 60;
      box-shadow: 0 0 12px #ff9100;
    }
  </style>
  <!-- Three.js + OrbitControls dari CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div class="timeline-bar" id="timelineBar"></div>

  <!-- Top Controls -->
  <div class="top-controls">
    <button class="btn btn-replay" id="btnReplay">↺ Replay</button>
    <button class="btn btn-water" id="btnWater">💧 Hujan / Water Bombing</button>
    <div class="slider-wrap">
      <span>Angin:</span>
      <input type="range" id="windSlider" min="0.5" max="3" step="0.1" value="1.2">
    </div>
    <button class="btn" id="btnRatio">📱 9:16 Shorts</button>
  </div>

  <!-- KPI Stat Badges -->
  <div class="kpi-container">
    <div class="kpi-card danger" id="cardIspu">
      <div class="kpi-label">KUALITAS UDARA (ISPU)</div>
      <div class="kpi-value" id="valIspu">603</div>
      <div class="kpi-status">BERBAHAYA</div>
    </div>
    <div class="kpi-card" id="cardArea">
      <div class="kpi-label">LUAS TERBAKAR</div>
      <div class="kpi-value" id="valArea">0 hektar</div>
    </div>
  </div>

  <!-- Bottom Captions -->
  <div class="bottom-overlay">
    <div class="babak-pill" id="babakPill">BABAK 1</div>
    <div class="babak-title" id="babakTitle">Hutan Gambut Sehat</div>
    <div class="babak-desc" id="babakDesc">Gambut terbentuk dari sisa tumbuhan purba selama ribuan tahun. Menyimpan cadangan karbon raksasa dan rumah bagi satwa liar.</div>
  </div>

  <!-- Canvas Container -->
  <div id="canvas-container">
    <canvas id="threeCanvas"></canvas>
  </div>

  <script>
    // =========================================================================
    // SIMULASI 3D KARHUTLA LAHAN GAMBUT (Three.js Low-Poly Stylized)
    // =========================================================================
    const canvas = document.getElementById('threeCanvas');
    const container = document.getElementById('canvas-container');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x60a5fa); // Langit biru awal
    scene.fog = new THREE.FogExp2(0x60a5fa, 0.012);

    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 400);
    camera.position.set(0, 18, 42);

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2.08;
    controls.minDistance = 8;
    controls.maxDistance = 120;

    // -------------------------------------------------------------------------
    // LIGHTING
    // -------------------------------------------------------------------------
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x3d2817, 0.7);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff7ed, 1.4);
    sunLight.position.set(25, 45, 20);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 120;
    const d = 36;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    scene.add(sunLight);

    // Fire ambient point light
    const fireGlowLight = new THREE.PointLight(0xff4500, 0, 50);
    fireGlowLight.position.set(0, 4, 0);
    scene.add(fireGlowLight);

    // -------------------------------------------------------------------------
    // 1. ROLLING PEATLAND TERRAIN & WINDING RIVER
    // -------------------------------------------------------------------------
    const terrainSize = 65;
    const terrainGeo = new THREE.PlaneGeometry(terrainSize, terrainSize, 64, 64);
    terrainGeo.rotateX(-Math.PI / 2);

    const posAttr = terrainGeo.attributes.position;
    const groundHeights = [];
    for (let i = 0; i < posAttr.count; i++) {
      const x = posAttr.getX(i);
      const z = posAttr.getZ(i);

      // Undulating hills
      let y = Math.sin(x * 0.12) * Math.cos(z * 0.12) * 2.2 + Math.sin(x * 0.05) * 1.5;

      // Carve winding river along x axis
      const riverZ = Math.sin(x * 0.1) * 7.5 - 2;
      const distToRiver = Math.abs(z - riverZ);
      if (distToRiver < 5.5) {
        y -= Math.cos((distToRiver / 5.5) * Math.PI * 0.5) * 2.4;
      }
      posAttr.setY(i, y);
      groundHeights.push({ x, z, y });
    }
    terrainGeo.computeVertexNormals();

    const terrainMat = new THREE.MeshLambertMaterial({
      color: 0x3d2817, // Cokelat gelap tanah gambut
      flatShading: true,
    });
    const terrain = new THREE.Mesh(terrainGeo, terrainMat);
    terrain.receiveShadow = true;
    scene.add(terrain);

    // River Water
    const riverGeo = new THREE.PlaneGeometry(terrainSize, 7, 32, 8);
    riverGeo.rotateX(-Math.PI / 2);
    const riverMat = new THREE.MeshPhongMaterial({
      color: 0x0077b6,
      emissive: 0x003366,
      shininess: 90,
      transparent: true,
      opacity: 0.85,
      flatShading: true,
    });
    const river = new THREE.Mesh(riverGeo, riverMat);
    river.position.set(0, -1.1, -2);
    scene.add(river);

    function getTerrainHeight(x, z) {
      let y = Math.sin(x * 0.12) * Math.cos(z * 0.12) * 2.2 + Math.sin(x * 0.05) * 1.5;
      const riverZ = Math.sin(x * 0.1) * 7.5 - 2;
      const distToRiver = Math.abs(z - riverZ);
      if (distToRiver < 5.5) {
        y -= Math.cos((distToRiver / 5.5) * Math.PI * 0.5) * 2.4;
      }
      return y;
    }

    // -------------------------------------------------------------------------
    // 2. 160+ LOW-POLY PROCEDURAL TREES (Pines & Leafy Canopy)
    // -------------------------------------------------------------------------
    const trees = [];
    const treeGroup = new THREE.Group();
    scene.add(treeGroup);

    const greenPalettes = [0x2d6a4f, 0x40916c, 0x52b788, 0x1b4332, 0x74c69d];

    function createLowPolyTree(x, z, type = 0) {
      const y = getTerrainHeight(x, z);
      const tg = new THREE.Group();
      tg.position.set(x, y, z);

      // Trunk
      const trunkH = 1.8 + Math.random() * 0.8;
      const trunkGeo = new THREE.CylinderGeometry(0.18, 0.32, trunkH, 5);
      const trunkMat = new THREE.MeshLambertMaterial({ color: 0x2b1d14, flatShading: true });
      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.position.y = trunkH / 2;
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      tg.add(trunk);

      // Canopy Foliage
      const foliageMeshes = [];
      const col = greenPalettes[Math.floor(Math.random() * greenPalettes.length)];

      if (type === 0) {
        // Conical layered Pine
        const layers = 3;
        for (let l = 0; l < layers; l++) {
          const cGeo = new THREE.ConeGeometry(1.6 - l * 0.35, 1.6, 5);
          const cMat = new THREE.MeshLambertMaterial({ color: col, flatShading: true });
          const cone = new THREE.Mesh(cGeo, cMat);
          cone.position.y = trunkH + l * 0.95;
          cone.castShadow = true;
          cone.receiveShadow = true;
          tg.add(cone);
          foliageMeshes.push(cone);
        }
      } else {
        // Leafy Icosahedron
        const fGeo = new THREE.IcosahedronGeometry(1.35 + Math.random() * 0.4, 1);
        const fMat = new THREE.MeshLambertMaterial({ color: col, flatShading: true });
        const fMesh = new THREE.Mesh(fGeo, fMat);
        fMesh.position.y = trunkH + 1.1;
        fMesh.castShadow = true;
        fMesh.receiveShadow = true;
        tg.add(fMesh);
        foliageMeshes.push(fMesh);
      }

      treeGroup.add(tg);
      return {
        group: tg,
        trunk: trunk,
        foliage: foliageMeshes,
        x, z, y,
        state: 'healthy', // healthy, burning, charred
        burnProgress: 0,
        origColors: foliageMeshes.map(m => m.material.color.clone()),
      };
    }

    // Populate 165 trees avoiding river bed
    for (let i = 0; i < 170; i++) {
      const rx = (Math.random() - 0.5) * 54;
      const rz = (Math.random() - 0.5) * 54;
      const riverZ = Math.sin(rx * 0.1) * 7.5 - 2;
      if (Math.abs(rz - riverZ) > 3.8) {
        const type = Math.random() > 0.4 ? 0 : 1;
        trees.push(createLowPolyTree(rx, rz, type));
      }
    }

    // Small village settlement on far corner
    const houseGroup = new THREE.Group();
    for (let h = 0; h < 3; h++) {
      const hx = 18 + h * 4.2;
      const hz = 16 + (h % 2) * 3;
      const hy = getTerrainHeight(hx, hz);

      const hBody = new THREE.Mesh(
        new THREE.BoxGeometry(2.4, 1.8, 2.2),
        new THREE.MeshLambertMaterial({ color: 0xddb892, flatShading: true })
      );
      hBody.position.set(hx, hy + 0.9, hz);
      hBody.castShadow = true;
      houseGroup.add(hBody);

      const hRoof = new THREE.Mesh(
        new THREE.ConeGeometry(2.1, 1.4, 4),
        new THREE.MeshLambertMaterial({ color: 0x9c6644, flatShading: true })
      );
      hRoof.position.set(hx, hy + 2.4, hz);
      hRoof.rotation.y = Math.PI / 4;
      hRoof.castShadow = true;
      houseGroup.add(hRoof);
    }
    scene.add(houseGroup);

    // -------------------------------------------------------------------------
    // 3. LOW-POLY FLYING BIRDS
    // -------------------------------------------------------------------------
    const birds = [];
    const birdGeo = new THREE.BufferGeometry();
    // Simple V-wing geometry
    const birdVerts = new Float32Array([
      0, 0, 0.4,   -0.8, 0.3, -0.2,   0, 0, -0.4,
      0, 0, 0.4,    0, 0, -0.4,       0.8, 0.3, -0.2
    ]);
    birdGeo.setAttribute('position', new THREE.BufferAttribute(birdVerts, 3));
    birdGeo.computeVertexNormals();
    const birdMat = new THREE.MeshBasicMaterial({ color: 0x1e293b, side: THREE.DoubleSide });

    for (let b = 0; b < 6; b++) {
      const bird = new THREE.Mesh(birdGeo, birdMat);
      bird.scale.setScalar(0.7);
      bird.position.set(-20 + b * 4, 16 + Math.random() * 3, -10 + b * 2);
      scene.add(bird);
      birds.push({ mesh: bird, speed: 0.12 + Math.random() * 0.05, phase: b });
    }

    // -------------------------------------------------------------------------
    // 4. FIRE & SMOKE PARTICLE SYSTEMS (Additive Blending)
    // -------------------------------------------------------------------------
    const FIRE_COUNT = 450;
    const fireGeo = new THREE.BufferGeometry();
    const firePos = new Float32Array(FIRE_COUNT * 3);
    const fireColors = new Float32Array(FIRE_COUNT * 3);
    const fireData = [];

    for (let f = 0; f < FIRE_COUNT; f++) {
      firePos[f * 3] = 0;
      firePos[f * 3 + 1] = -50; // Hidden initially
      firePos[f * 3 + 2] = 0;

      const isYellow = Math.random() > 0.45;
      fireColors[f * 3] = 1.0;
      fireColors[f * 3 + 1] = isYellow ? 0.8 : 0.25;
      fireColors[f * 3 + 2] = 0.0;

      fireData.push({
        x: 0, y: -50, z: 0,
        vx: 0, vy: 0.1 + Math.random() * 0.25, vz: 0,
        life: 0,
        maxLife: 0.8 + Math.random() * 0.6,
        active: false,
      });
    }
    fireGeo.setAttribute('position', new THREE.BufferAttribute(firePos, 3));
    fireGeo.setAttribute('color', new THREE.BufferAttribute(fireColors, 3));

    const fireMat = new THREE.PointsMaterial({
      size: 1.4,
      vertexColors: true,
      blending: THREE.AdditiveBlending,
      transparent: true,
      opacity: 0.95,
      depthWrite: false,
    });
    const firePoints = new THREE.Points(fireGeo, fireMat);
    scene.add(firePoints);

    // SMOKE PARTICLES
    const SMOKE_COUNT = 300;
    const smokeGeo = new THREE.BufferGeometry();
    const smokePos = new Float32Array(SMOKE_COUNT * 3);
    const smokeData = [];

    for (let s = 0; s < SMOKE_COUNT; s++) {
      smokePos[s * 3] = 0;
      smokePos[s * 3 + 1] = -50;
      smokePos[s * 3 + 2] = 0;
      smokeData.push({
        x: 0, y: -50, z: 0,
        vx: 0, vy: 0.08 + Math.random() * 0.18, vz: 0,
        life: 0, maxLife: 1.8 + Math.random() * 1.2, active: false
      });
    }
    smokeGeo.setAttribute('position', new THREE.BufferAttribute(smokePos, 3));
    const smokeMat = new THREE.PointsMaterial({
      color: 0x4a4e69,
      size: 3.8,
      transparent: true,
      opacity: 0.55,
      depthWrite: false,
    });
    const smokePoints = new THREE.Points(smokeGeo, smokeMat);
    scene.add(smokePoints);

    // WATER BOMBING RAIN PARTICLES
    const RAIN_COUNT = 800;
    const rainGeo = new THREE.BufferGeometry();
    const rainPos = new Float32Array(RAIN_COUNT * 3);
    for (let r = 0; r < RAIN_COUNT; r++) {
      rainPos[r * 3] = (Math.random() - 0.5) * 60;
      rainPos[r * 3 + 1] = -50;
      rainPos[r * 3 + 2] = (Math.random() - 0.5) * 60;
    }
    rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
    const rainMat = new THREE.PointsMaterial({
      color: 0x90e0ef,
      size: 0.5,
      transparent: true,
      opacity: 0.8,
    });
    const rainPoints = new THREE.Points(rainGeo, rainMat);
    scene.add(rainPoints);

    // -------------------------------------------------------------------------
    // 5. TIMELINE / BABAK CONTROLLER (0 - 52 Detik)
    // -------------------------------------------------------------------------
    let timelineTime = 0;
    let isPlaying = true;
    let isWaterBombing = false;
    let waterBombingProgress = 0;
    let windSpeed = 1.2;

    const BABAK = [
      {
        start: 0, end: 8,
        pill: 'BABAK 1',
        title: 'Hutan Gambut Sehat',
        desc: 'Gambut terbentuk dari sisa tumbuhan purba selama ribuan tahun. Menyimpan cadangan karbon raksasa dan rumah bagi satwa liar.',
        skyColor: 0x60a5fa, fogDensity: 0.012,
        ispu: 42, ispuStatus: 'SEHAT', ispuDanger: false,
        areaBurned: 0,
      },
      {
        start: 8, end: 18,
        pill: 'BABAK 2',
        title: 'Titik Api Muncul',
        desc: 'Satu percikan api membakar serasah daun kering. Lahan gambut yang terdegradasi dan kering membuat api merambat cepat tak kasat mata!',
        skyColor: 0xfbbf24, fogDensity: 0.022,
        ispu: 145, ispuStatus: 'TIDAK SEHAT', ispuDanger: false,
        areaBurned: 45,
      },
      {
        start: 18, end: 32,
        pill: 'BABAK 3',
        title: 'Api Menyebar & Membara',
        desc: 'Angin kencang memperluas kobaran! Api merambat di bawah tanah sedalam 4 meter, pohon-pohon berubah hangus menjadi arang!',
        skyColor: 0xf97316, fogDensity: 0.038,
        ispu: 380, ispuStatus: 'SANGAT BERBAHAYA', ispuDanger: true,
        areaBurned: 1420,
      },
      {
        start: 32, end: 42,
        pill: 'BABAK 4',
        title: 'Dampak & Krisis Kabut Asap',
        desc: 'Kabut asap pekat menutup pemukiman. Kualitas udara melonjak ke level darurat pernapasan. Ribuan hektar hutan musnah.',
        skyColor: 0xd90429, fogDensity: 0.052,
        ispu: 603, ispuStatus: 'BERBAHAYA EKSTREM', ispuDanger: true,
        areaBurned: 2939,
      },
      {
        start: 42, end: 54,
        pill: 'BABAK 5',
        title: 'Water Bombing & Pemadaman',
        desc: 'Helikopter bom air dan sekat kanal membasahi kembali gambut. Api padam mendesis, asap putih membubung, alam perlahan pulih.',
        skyColor: 0x38bdf8, fogDensity: 0.018,
        ispu: 85, ispuStatus: 'MEMBAIK', ispuDanger: false,
        areaBurned: 2939,
      }
    ];

    // Origin of fire (middle left)
    const fireOrigin = new THREE.Vector3(-14, 0, 4);

    // UI Elements
    const bar = document.getElementById('timelineBar');
    const bPill = document.getElementById('babakPill');
    const bTitle = document.getElementById('babakTitle');
    const bDesc = document.getElementById('babakDesc');
    const cIspu = document.getElementById('cardIspu');
    const cArea = document.getElementById('cardArea');
    const vIspu = document.getElementById('valIspu');
    const vArea = document.getElementById('valArea');

    function updateBabakUI(b, t) {
      bPill.textContent = b.pill;
      bTitle.textContent = b.title;
      bDesc.textContent = b.desc;

      // Show KPI cards on babak 2+
      if (t > 7) {
        cIspu.classList.add('show');
        cArea.classList.add('show');
      } else {
        cIspu.classList.remove('show');
        cArea.classList.remove('show');
      }

      // ISPU
      vIspu.textContent = Math.round(b.ispu);
      if (b.ispuDanger) {
        cIspu.classList.add('danger');
      } else {
        cIspu.classList.remove('danger');
      }

      // Count up area
      vArea.textContent = Math.round(b.areaBurned).toLocaleString('id-ID') + ' hektar';
    }

    // -------------------------------------------------------------------------
    // ANIMATION TICK LOOP
    // -------------------------------------------------------------------------
    let lastTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      if (isPlaying) {
        timelineTime += dt;
        if (timelineTime > 54) timelineTime = 0; // loop
      }

      const totalDur = 54;
      bar.style.width = ((timelineTime / totalDur) * 100) + '%';

      // Current Babak
      let curB = BABAK[0];
      for (const b of BABAK) {
        if (timelineTime >= b.start) curB = b;
      }
      updateBabakUI(curB, timelineTime);

      // Sky & Fog transition
      const targetSky = new THREE.Color(curB.skyColor);
      scene.background.lerp(targetSky, dt * 1.5);
      scene.fog.color.lerp(targetSky, dt * 1.5);
      scene.fog.density = THREE.MathUtils.lerp(scene.fog.density, curB.fogDensity, dt * 1.5);

      // Sun light dimming during heavy smoke
      const sunInt = curB.start >= 18 && curB.start < 42 ? 0.5 : 1.4;
      sunLight.intensity = THREE.MathUtils.lerp(sunLight.intensity, sunInt, dt * 2);

      // Camera Path / Cinematic Flyover
      if (timelineTime < 8) {
        // Flyover slow
        camera.position.x = Math.sin(timelineTime * 0.15) * 22;
        camera.position.y = 16 + Math.cos(timelineTime * 0.1) * 3;
        camera.position.z = 38 - timelineTime * 1.2;
        controls.target.set(0, 0, 0);
      } else if (timelineTime < 18) {
        // Zoom into fire origin
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, fireOrigin.x + 8, dt * 1.5);
        camera.position.y = THREE.MathUtils.lerp(camera.position.y, 6.5, dt * 1.5);
        camera.position.z = THREE.MathUtils.lerp(camera.position.z, fireOrigin.z + 12, dt * 1.5);
        controls.target.lerp(fireOrigin, dt * 2);
      } else if (timelineTime < 32) {
        // Tracking burning forest
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, 6, dt * 1.2);
        camera.position.y = THREE.MathUtils.lerp(camera.position.y, 14, dt * 1.2);
        camera.position.z = THREE.MathUtils.lerp(camera.position.z, 28, dt * 1.2);
        controls.target.lerp(new THREE.Vector3(0, 2, 0), dt * 1.5);
      } else if (timelineTime < 42) {
        // High altitude wide shot of smog
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, 24, dt * 1.2);
        camera.position.y = THREE.MathUtils.lerp(camera.position.y, 28, dt * 1.2);
        camera.position.z = THREE.MathUtils.lerp(camera.position.z, 44, dt * 1.2);
        controls.target.lerp(new THREE.Vector3(5, 0, 5), dt * 1.5);
      } else {
        // Returning to calm recovery view
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, 0, dt * 1.2);
        camera.position.y = THREE.MathUtils.lerp(camera.position.y, 18, dt * 1.2);
        camera.position.z = THREE.MathUtils.lerp(camera.position.z, 40, dt * 1.2);
        controls.target.lerp(new THREE.Vector3(0, 0, 0), dt * 1.5);
      }
      controls.update();

      // Birds animation
      for (const b of birds) {
        b.mesh.position.x += b.speed * 1.5;
        b.mesh.position.z += Math.sin(now * 0.002 + b.phase) * 0.05;
        b.mesh.rotation.z = Math.sin(now * 0.012 + b.phase) * 0.25;
        if (b.mesh.position.x > 32) b.mesh.position.x = -32;
      }

      // Fire Radius Spreading based on timeline
      let fireRadius = 0;
      if (timelineTime >= 8 && timelineTime < 42) {
        fireRadius = (timelineTime - 8) * 0.95 * windSpeed;
      } else if (timelineTime >= 42 || isWaterBombing) {
        // Extinguishing
        fireRadius = Math.max(0, 32 - (timelineTime - 42) * 5.5);
      }

      // Trees ignition & charring
      const burningTrees = [];
      for (let i = 0; i < trees.length; i++) {
        const tr = trees[i];
        const dist = Math.hypot(tr.x - fireOrigin.x, tr.z - fireOrigin.z);

        if (dist < fireRadius && tr.state === 'healthy') {
          tr.state = 'burning';
        }

        if (tr.state === 'burning') {
          tr.burnProgress = Math.min(1, tr.burnProgress + dt * 0.35);
          burningTrees.push(tr);

          // Char foliage to black
          for (let f = 0; f < tr.foliage.length; f++) {
            const mesh = tr.foliage[f];
            const orig = tr.origColors[f];
            mesh.material.color.lerpColors(orig, new THREE.Color(0x111111), tr.burnProgress);
            // Slight shrink
            mesh.scale.setScalar(1 - tr.burnProgress * 0.22);
          }
          tr.trunk.material.color.lerp(new THREE.Color(0x0a0503), tr.burnProgress);

          if (tr.burnProgress >= 1) {
            tr.state = 'charred';
          }
        } else if (timelineTime < 8) {
          // Reset trees on loop
          tr.state = 'healthy';
          tr.burnProgress = 0;
          for (let f = 0; f < tr.foliage.length; f++) {
            tr.foliage[f].material.color.copy(tr.origColors[f]);
            tr.foliage[f].scale.setScalar(1);
          }
        }
      }

      // Spawn Fire & Smoke Particles
      const fPos = fireGeo.attributes.position.array;
      const sPos = smokeGeo.attributes.position.array;

      if (burningTrees.length > 0 && timelineTime < 46) {
        fireGlowLight.intensity = Math.min(5, burningTrees.length * 0.2 + Math.sin(now * 0.02) * 0.8);
        fireGlowLight.position.set(fireOrigin.x + 4, 3, fireOrigin.z);

        for (let f = 0; f < FIRE_COUNT; f++) {
          const p = fireData[f];
          if (!p.active && Math.random() < 0.4) {
            const tr = burningTrees[Math.floor(Math.random() * burningTrees.length)];
            p.x = tr.x + (Math.random() - 0.5) * 1.8;
            p.y = tr.y + Math.random() * 2.5;
            p.z = tr.z + (Math.random() - 0.5) * 1.8;
            p.life = 0;
            p.active = true;
          }

          if (p.active) {
            p.life += dt;
            p.y += p.vy;
            p.x += (windSpeed * 0.08) + Math.sin(p.life * 10) * 0.04;
            p.z += Math.cos(p.life * 10) * 0.04;

            fPos[f * 3] = p.x;
            fPos[f * 3 + 1] = p.y;
            fPos[f * 3 + 2] = p.z;

            if (p.life >= p.maxLife) {
              p.active = false;
              fPos[f * 3 + 1] = -50;
            }
          }
        }

        // Smoke particles
        for (let s = 0; s < SMOKE_COUNT; s++) {
          const sp = smokeData[s];
          if (!sp.active && Math.random() < 0.3) {
            const tr = burningTrees[Math.floor(Math.random() * burningTrees.length)];
            sp.x = tr.x + (Math.random() - 0.5) * 2;
            sp.y = tr.y + 2.5;
            sp.z = tr.z + (Math.random() - 0.5) * 2;
            sp.life = 0;
            sp.active = true;
          }

          if (sp.active) {
            sp.life += dt;
            sp.y += sp.vy;
            sp.x += (windSpeed * 0.12) + Math.sin(sp.life * 4) * 0.05;
            sp.z += Math.cos(sp.life * 4) * 0.05;

            sPos[s * 3] = sp.x;
            sPos[s * 3 + 1] = sp.y;
            sPos[s * 3 + 2] = sp.z;

            if (sp.life >= sp.maxLife) {
              sp.active = false;
              sPos[s * 3 + 1] = -50;
            }
          }
        }
      } else {
        fireGlowLight.intensity = THREE.MathUtils.lerp(fireGlowLight.intensity, 0, dt * 2);
        for (let f = 0; f < FIRE_COUNT; f++) fPos[f * 3 + 1] = -50;
        for (let s = 0; s < SMOKE_COUNT; s++) sPos[s * 3 + 1] = -50;
      }

      fireGeo.attributes.position.needsUpdate = true;
      smokeGeo.attributes.position.needsUpdate = true;

      // Water Bombing / Rain Particles
      const rPos = rainGeo.attributes.position.array;
      if (timelineTime >= 42 || isWaterBombing) {
        for (let r = 0; r < RAIN_COUNT; r++) {
          rPos[r * 3 + 1] -= dt * 38;
          if (rPos[r * 3 + 1] < -1) {
            rPos[r * 3 + 1] = 25 + Math.random() * 15;
            rPos[r * 3] = (Math.random() - 0.5) * 55;
            rPos[r * 3 + 2] = (Math.random() - 0.5) * 55;
          }
        }
      } else {
        for (let r = 0; r < RAIN_COUNT; r++) rPos[r * 3 + 1] = -50;
      }
      rainGeo.attributes.position.needsUpdate = true;

      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);

    // -------------------------------------------------------------------------
    // BUTTON INTERACTIONS
    // -------------------------------------------------------------------------
    document.getElementById('btnReplay').addEventListener('click', () => {
      timelineTime = 0;
      isWaterBombing = false;
      for (const tr of trees) {
        tr.state = 'healthy';
        tr.burnProgress = 0;
        for (let f = 0; f < tr.foliage.length; f++) {
          tr.foliage[f].material.color.copy(tr.origColors[f]);
          tr.foliage[f].scale.setScalar(1);
        }
      }
    });

    document.getElementById('btnWater').addEventListener('click', () => {
      isWaterBombing = true;
      timelineTime = 42; // Jump to Water Bombing Babak
    });

    const windSlider = document.getElementById('windSlider');
    windSlider.addEventListener('input', (e) => {
      windSpeed = parseFloat(e.target.value);
    });

    const btnRatio = document.getElementById('btnRatio');
    let isPortrait = false;
    btnRatio.addEventListener('click', () => {
      isPortrait = !isPortrait;
      if (isPortrait) {
        canvas.classList.add('portrait-frame');
        btnRatio.textContent = '🖥️ Fullscreen';
      } else {
        canvas.classList.remove('portrait-frame');
        btnRatio.textContent = '📱 9:16 Shorts';
      }
      onWindowResize();
    });

    function onWindowResize() {
      const w = canvas.clientWidth || window.innerWidth;
      const h = canvas.clientHeight || window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }
    window.addEventListener('resize', onWindowResize);
  </script>
</body>
